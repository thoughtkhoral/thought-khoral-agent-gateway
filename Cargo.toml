[package]
name = "thought-khoral-agent-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[dependencies]
a2a = { package = "a2a-lf", version = "=0.3.0" }
a2a-client = { package = "a2a-client-lf", version = "=0.2.3", default-features = false, features = ["rustls-tls"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
